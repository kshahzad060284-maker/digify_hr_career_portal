name: Deploy Digify Career Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digify-career-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy Flutter Web
    runs-on: ubuntu-latest

    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      DEPLOY_PATH: /var/www/digify-career-portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Vendor private Digify Core package
        shell: bash
        env:
          DIGIFY_GITHUB_TOKEN: ${{ secrets.DIGIFY_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # flutter pub get does not use git credential rewrites reliably for
          # private packages. Clone with the PAT and override via
          # pubspec_overrides.yaml before pub get (same pattern as grc_web).

          if [ -z "${DIGIFY_GITHUB_TOKEN}" ]; then
            echo "ERROR: DIGIFY_GITHUB_TOKEN secret is missing."
            exit 1
          fi

          http_code="$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${DIGIFY_GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/hananmalik21/digify_core")"

          case "${http_code}" in
            200) echo "GitHub token can access digify_core." ;;
            401)
              echo "ERROR: GitHub token is invalid or expired (HTTP 401)."
              exit 1
              ;;
            404)
              echo "ERROR: Cannot access hananmalik21/digify_core (HTTP 404)."
              echo "Ensure the PAT has read access to the private Digify Core package."
              exit 1
              ;;
            *)
              echo "ERROR: Unexpected GitHub API response HTTP ${http_code} for digify_core."
              exit 1
              ;;
          esac

          AUTH="https://oauth2:${DIGIFY_GITHUB_TOKEN}@github.com/hananmalik21"

          echo "Cloning private package into _vendor/..."
          rm -rf _vendor
          mkdir -p _vendor

          git clone \
            --depth 1 \
            --branch main \
            "${AUTH}/digify_core.git" \
            _vendor/digify_core

          cat > pubspec_overrides.yaml <<'EOF'
          # Generated in CI — do not commit.
          dependency_overrides:
            digify_core:
              path: _vendor/digify_core
          EOF

          PUB_CACHE_DIR="${PUB_CACHE:-${HOME}/.pub-cache}"
          rm -rf "${PUB_CACHE_DIR}/git" 2>/dev/null || true

      - name: Determine Flutter version
        id: flutter_version
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ".fvmrc" ]; then
            VERSION=$(python3 -c '
          import json
          with open(".fvmrc", "r", encoding="utf-8") as file:
              print(json.load(file)["flutter"])
          ')
          else
            VERSION="stable"
          fi

          echo "Using Flutter version: ${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install Flutter
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            https://github.com/flutter/flutter.git \
            --depth 1 \
            --branch "${{ steps.flutter_version.outputs.version }}" \
            "${HOME}/flutter"

          echo "${HOME}/flutter/bin" >> "${GITHUB_PATH}"

      - name: Install project dependencies
        shell: bash
        run: |
          flutter config --enable-web
          flutter pub get

      - name: Build Flutter Web (WASM)
        shell: bash
        run: |
          flutter build web --release --wasm

      - name: Install deployment tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d "${HOME}/.ssh"

          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" \
            > "${HOME}/.ssh/id_ed25519"

          printf '%s\n' "${{ secrets.SERVER_KNOWN_HOSTS }}" \
            > "${HOME}/.ssh/known_hosts"

          chmod 600 "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Deploy to Ubuntu server
        shell: bash
        run: |
          set -euo pipefail

          rsync \
            --archive \
            --compress \
            --delete \
            --human-readable \
            -e "ssh -i ${HOME}/.ssh/id_ed25519" \
            build/web/ \
            "${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/"

      - name: Verify deployment
        shell: bash
        run: |
          sleep 5
          curl --fail --head --retry 5 "https://careers.digifyhr.com/"
